<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <!-- Background -->
    <rect width="100" height="100" rx="16" fill="#473c33"/>
    
    <!-- Base Plate representing Dish -->
    <path d="M 18 76 L 82 76" stroke="white" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Cloche Dome representing Kitchen/Food -->
    <path d="M 26 76 V 60 C 26 35 74 35 74 60 V 76" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- Cloche Knob -->
    <circle cx="50" cy="24" r="5" fill="white"/>
    
    <!-- Analytics Trend Line inside the cloche representing Analytics -->
    <path d="M 36 66 L 46 54 L 54 58 L 64 44" stroke="#e8e4db" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Data Points -->
    <circle cx="64" cy="44" r="3" fill="#e8e4db"/>
    <circle cx="54" cy="58" r="3" fill="#e8e4db"/>
    <circle cx="46" cy="54" r="3" fill="#e8e4db"/>
    <circle cx="36" cy="66" r="3" fill="#e8e4db"/>
</svg>
